<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280" role="img" aria-label="Deepa — The Researcher orb">
  <!-- Deepa — The Researcher -->
  <defs>
    <filter id="marble-deepa" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0110" numOctaves="2" seed="7" result="noise">
        <animate attributeName="baseFrequency" values="0.0079;0.0141;0.0110;0.0079" dur="1.56s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="37" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" values="23;45;37;23" dur="1.32s" repeatCount="indefinite"/>
      </feDisplacementMap>
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <filter id="glow-deepa">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="clip-deepa">
      <circle cx="140" cy="140" r="135"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip-deepa)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 140 140;4 140 140;-3 140 140;0 140 140" dur="2.25s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="280" height="280" fill="#e11d48"/>
  <circle cx="200" cy="100" r="115" fill="#c026d3" opacity="0.85" filter="url(#marble-deepa)">
    <animate attributeName="cy" values="100;120;90;100" dur="1.65s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="200;180;210;200" dur="1.50s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.67;0.95;0.67" dur="1.08s" repeatCount="indefinite"/>
  </circle>
  <circle cx="80" cy="190" r="105" fill="#6366f1" opacity="0.8" filter="url(#marble-deepa)">
    <animate attributeName="cy" values="190;170;200;190" dur="1.35s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="80;100;70;80" dur="1.80s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.62;0.90;0.62" dur="1.08s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="60" r="85" fill="#fb7185" opacity="0.7" filter="url(#marble-deepa)">
    <animate attributeName="cy" values="60;80;50;60" dur="1.95s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.52;0.80;0.52" dur="1.08s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="220" r="75" fill="#e11d48" opacity="0.6" filter="url(#marble-deepa)">
    <animate attributeName="cx" values="140;120;160;140" dur="1.65s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0.70;0.45" dur="1.08s" repeatCount="indefinite"/>
  </circle>
    </g>
  </g>

  <!-- Specular highlight -->
  <ellipse cx="90" cy="80" rx="40" ry="30" fill="white" opacity="0.4" filter="url(#glow-deepa)"/>
  <ellipse cx="100" cy="90" rx="20" ry="15" fill="white" opacity="0.6"/>
  <!-- Rim -->
  <circle cx="140" cy="140" r="135" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
</svg>