<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280" role="img" aria-label="Isha — The Reasoner orb">
  <!-- Isha — The Reasoner -->
  <defs>
    <filter id="marble-isha" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0140" numOctaves="2" seed="19" result="noise">
        <animate attributeName="baseFrequency" values="0.0101;0.0179;0.0140;0.0101" dur="1.56s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="34" xChannelSelector="R" yChannelSelector="G">
        <animate attributeName="scale" values="21;41;34;21" dur="1.32s" repeatCount="indefinite"/>
      </feDisplacementMap>
      <feGaussianBlur stdDeviation="0.8"/>
    </filter>
    <filter id="glow-isha">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="clip-isha">
      <circle cx="140" cy="140" r="135"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip-isha)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 140 140;4 140 140;-3 140 140;0 140 140" dur="2.25s" repeatCount="indefinite"/>
      <rect x="0" y="0" width="280" height="280" fill="#7c3aed"/>
  <circle cx="100" cy="80" r="120" fill="#a78bfa" opacity="0.85" filter="url(#marble-isha)">
    <animate attributeName="cy" values="80;100;70;80" dur="1.50s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="100;120;85;100" dur="1.65s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.67;0.95;0.67" dur="1.08s" repeatCount="indefinite"/>
  </circle>
  <circle cx="220" cy="190" r="100" fill="#4338ca" opacity="0.8" filter="url(#marble-isha)">
    <animate attributeName="cy" values="190;170;200;190" dur="1.35s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="220;200;230;220" dur="1.80s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.62;0.90;0.62" dur="1.08s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="210" r="85" fill="#818cf8" opacity="0.7" filter="url(#marble-isha)">
    <animate attributeName="cy" values="210;190;220;210" dur="1.95s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.52;0.80;0.52" dur="1.08s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="60" r="75" fill="#7c3aed" opacity="0.6" filter="url(#marble-isha)">
    <animate attributeName="cx" values="180;160;190;180" dur="1.50s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.45;0.70;0.45" dur="1.08s" repeatCount="indefinite"/>
  </circle>
    </g>
  </g>

  <!-- Specular highlight -->
  <ellipse cx="90" cy="80" rx="40" ry="30" fill="white" opacity="0.4" filter="url(#glow-isha)"/>
  <ellipse cx="100" cy="90" rx="20" ry="15" fill="white" opacity="0.6"/>
  <!-- Rim -->
  <circle cx="140" cy="140" r="135" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
</svg>